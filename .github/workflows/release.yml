name: Build & Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer & Portable EXE
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Dynamic Island for Windows ${{ github.ref_name }}
          body: |
            ## 🏝️ Dynamic Island for Windows (${{ github.ref_name }})

            ### 📥 Cara Install untuk Teman / Rekan:
            1. **Versi Installer (Direkomendasikan):** Download **`Dynamic.Island.Setup.2.1.0.exe`**, klik 2x untuk meng-install. Otomatis membuat shortcut dan berjalan saat laptop dinyalakan.
            2. **Versi Portable (Tanpa Install):** Download **`Dynamic.Island.2.1.0.exe`**, langsung klik 2x untuk menjalankan.

            ### ✨ Fitur Terbaru (${{ github.ref_name }}):
            - **Live Mini Synced Lyrics 1-per-1 di Atas Layar**: Saat memutar lagu di Spotify dan kursor tidak menyentuh Dynamic Island, kapsul mini di atas layar otomatis menampilkan potongan lirik 1 per 1 secara real-time lengkap dengan cover lagu mini & equalizer.
            - **Hands-Free *"Hei Jarvis"* Wake-Word Responsif**: Langsung merespons panggilan suara *"Hei Jarvis"* kapan saja tanpa perlu menekan `Ctrl + 0` atau klik manual (tetap mendukung `Ctrl + 0` sebagai pintasan).
            - **UI Nusa 1.1 × Cyberpunk Notch (`556×236px`)**: Desain kapsul kaca *obsidian* yang ringkas, responsif menutup instan saat kursor menjauh, dilengkapi **Bottom Hover Dock** (titik indikator berubah menjadi ikon saat di-hover).
            - **Auto Micro-Notch saat Buka Browser/Google**: Otomatis mengecil menjadi kapsul ultra-tipis (`252×26px`) saat sedang aktif membuka Chrome/Edge/Brave/Firefox agar tidak menutupi tab browser.
            - **Apple-Style System Rings & Kalender Reminder/Checklist**: Lingkaran indikator **Baterai Laptop, Wi-Fi, dan Baterai Bluetooth**, ditambah fitur **Kalender Mingguan (`M T W T F S S`) Interaktif** — klik tanggal mana saja untuk menambah jadwal/reminder & checklist harian.
            - **Autonomous Jarvis Automation (`Ctrl + 0` / *"Hei Jarvis"*)**:
              - **Auto-Fill Google Form Mandiri**: Membuka link Google Form, membaca tipe pertanyaan secara cerdas, mencocokkan jawaban dengan konteks, dan menampilkan *Preview* sebelum Submit.
              - **Kendali Penuh Tab Browser**: Buka URL, pindah tab, refresh, tutup tab, dan baca isi halaman web aktif.
              - **VS Code Live Code Assistant**: Analisis dan perbaiki kode langsung di workspace lokal serta sorot baris yang diperbaiki di VS Code (`code --goto`).
            - **Drag & Drop Pintar (`Today` & `Shelf`)**: Tarik aplikasi/folder/file dari Windows Explorer ke **Today** untuk membuat shortcut cepat, atau ke **Shelf** untuk menyimpan file sementara (*File Stash*) & riwayat *Clipboard*.
            - **Spotify & Live Synced Lyrics + Clock Tools**: Kontrol musik real-time dengan lirik karaoke otomatis, serta Timer, Stopwatch, dan Alarm.
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
